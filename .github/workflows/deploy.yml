name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许手动触发部署
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只运行一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


# =====================================================
# 每次修改后的推送流程
# =====================================================

# 1. 查看当前改动了哪些文件（可选，但推荐）
# git status

# 2. 将所有修改的文件添加到暂存区
# git add .

# 3. 提交并写下本次更新的描述（这个描述会出现在部署历史里）
# git commit -m "这里写你本次更新的内容，比如：修复首页错别字"

# 4. 推送到远程仓库的 main 分支
# git push origin main