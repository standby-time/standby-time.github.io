name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 每天北京时间 0:00 自动同步贡献数据并部署（UTC+8 → UTC 16:00）
  schedule:
    - cron: '7 16 * * *'
  # 允许手动触发部署
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只运行一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 同步 GitHub 贡献数据
        run: node scripts/sync-github-contributions.js standby-time
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 同步 C 语言刷题数据
        run: |
          git clone https://github.com/standby-time/c-practice-100-CaiNiao.git /tmp/c-practice-100-CaiNiao
          node scripts/sync-c-practice.js /tmp/c-practice-100-CaiNiao
        continue-on-error: true  # 独立仓库暂未创建时不阻塞部署

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


# =====================================================
# 每次修改后的推送流程
# =====================================================

# 1. 查看当前改动了哪些文件（可选，但推荐）
# git status

# 2. 将所有修改的文件添加到暂存区
# git add .

# 3. 提交并写下本次更新的描述（这个描述会出现在部署历史里）
# git commit -m "这里写你本次更新的内容，比如：修复首页错别字"

# 4. 推送到远程仓库的 main 分支
# git push origin main